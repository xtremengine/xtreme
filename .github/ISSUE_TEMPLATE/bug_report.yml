name: Bug Report
description: Report a bug in Xtreme Engine
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Create a World with...
        2. Spawn an entity with...
        3. Run system...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: input
    id: rust-version
    attributes:
      label: Rust Version
      description: Output of `rustc --version`
      placeholder: rustc 1.75.0 (...)
    validations:
      required: true

  - type: input
    id: xtreme-version
    attributes:
      label: Xtreme Engine Version
      placeholder: 0.1.0
    validations:
      required: true

  - type: checkboxes
    id: features
    attributes:
      label: Features Enabled
      options:
        - label: ml
        - label: scripting

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Please include any relevant error messages or logs
      render: shell

  - type: textarea
    id: code
    attributes:
      label: Minimal Reproducible Example
      description: If possible, provide minimal code that reproduces the issue
      render: rust
